name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # The tests expect Windows line endings in failure messages, so they only pass on Windows.
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Build & Test
        run: ./do.cmd test
      - name: Pack
        run: ./do.cmd pack
